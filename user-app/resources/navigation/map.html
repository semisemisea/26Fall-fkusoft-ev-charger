<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>应用内路线地图</title>
<style>
html,body,#map,canvas{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:sans-serif;background:#edf3f5}#map,canvas{position:absolute;inset:0}#notice{position:absolute;z-index:1000;top:10px;left:10px;padding:8px 12px;background:white;border-radius:8px;color:#37474f;pointer-events:none;font-size:13px}#fit{position:absolute;z-index:1000;right:12px;bottom:12px;background:white;border:1px solid #cbd5e1;border-radius:8px;padding:10px;cursor:pointer}canvas{touch-action:none}
</style>
<div id="map"></div><canvas id="fallback"></canvas><div id="notice">正在加载路线…</div><button id="fit">显示全程</button>
<script src="map.js"></script>
</html>
